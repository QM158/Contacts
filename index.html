<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slot Selector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Quinn Archibald">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 50px;
    }
    .container {
      max-width: 600px;
    }
    h2 {
      color: #343a40;
      margin-bottom: 30px;
    }
    #output {
      font-weight: bold;
      margin-top: 20px;
      color: #0d6efd;
    }
  </style>
</head>
<body>

  <div class="container text-center">
    <h2>✨ Welcome! Here's your legendary lineup: ✨</h2>

    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Slot #</th>
          <th>Number</th>
        </tr>
      </thead>
      <tbody id="nameTable"></tbody>
    </table>

    <div class="mb-3">
      <label for="slotInput" class="form-label">Enter a Slot Number:</label>
      <input type="number" class="form-control" id="slotInput" placeholder="e.g. 2" />
    </div>
    <button class="btn btn-primary" onclick="findName()">Reveal Name</button>

    <p id="output"></p>
  </div>

  <script>
    const names = ["Arnold", "Sly", "Dwayne", "Vin", "JCVD", "Steven"];
    var guessed = [false, false, false, false, false, false];

    function findName() {
      const slotInput = document.getElementById("slotInput");
      const output = document.getElementById("output");
      const slot = parseInt(slotInput.value);
      let found = false;

      for (let i = 0; i < names.length; i++) {
        if (i === slot) {
          output.innerText = `You selected ${names[i]}.`;
          guessed[i] = true;
          found = true;
          break;
        }
      }

      updateTable();

      if (!found) {
        output.innerText = "Name not found. Try again!";
      }

      if (confirm("Would you like to select another name?")) {
        slotInput.value = "";
        output.innerText = "";
      }
    }

    function updateTable() {
      const nameTable = document.getElementById("nameTable");
      nameTable.innerHTML = "";
      for (let i = 0; i < names.length; i++) {
        nameTable.innerHTML += `<tr><td>${i}</td><td>${guessed[i] ? names[i] : ""}</td></tr>`;
      }
    }
  </script>

</body>

</html>
